<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orb of Augmentation. Roll it against a magic item and one more modifier
       writes itself onto the surface; deep indigo, heavy as unrealised potential. -->
  <defs>
    <radialGradient id="aug-body" cx="0.38" cy="0.32" r="0.65">
      <stop offset="0" stop-color="#c8b8f0"/>
      <stop offset="0.55" stop-color="#5530a8"/>
      <stop offset="1" stop-color="#1a0a50"/>
    </radialGradient>
    <radialGradient id="aug-hi" cx="0.32" cy="0.28" r="0.38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- teardrop body: wide round top tapering to a point at the bottom -->
  <path d="M32,9 C52,9 52,38 32,56 C12,38 12,9 32,9 Z"
        fill="url(#aug-body)" stroke="#100630" stroke-width="1.2"/>
  <!-- specular highlight upper-left -->
  <ellipse cx="24" cy="23" rx="8" ry="6" fill="url(#aug-hi)"/>
  <!-- reflected bounce light at the drip tip -->
  <ellipse cx="32" cy="52" rx="4" ry="2.5" fill="#8060d0" opacity="0.5"/>
  <!-- pooled shadow beneath -->
  <ellipse cx="32" cy="59" rx="10" ry="2.5" fill="#000000" opacity="0.22"/>
</svg>
