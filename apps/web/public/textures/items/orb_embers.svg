<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orb of Embers. The rarest currency; press it against a rare item and one more
       modifier erupts from within, hot orange-red with a molten white core. -->
  <defs>
    <radialGradient id="ember-body" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.3" stop-color="#ff7020"/>
      <stop offset="0.75" stop-color="#c01808"/>
      <stop offset="1" stop-color="#5a0800"/>
    </radialGradient>
    <radialGradient id="ember-hi" cx="0.32" cy="0.28" r="0.38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cracked round orb body -->
  <circle cx="32" cy="33" r="21" fill="url(#ember-body)" stroke="#3a0a00" stroke-width="1.2"/>
  <!-- crack seam running top to bottom with a branch -->
  <path d="M32,13 L28,26 L35,33 L29,45 L32,53"
        stroke="#ff9040" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M35,33 L42,30" stroke="#ff9040" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- specular highlight upper-left -->
  <ellipse cx="24" cy="25" rx="9" ry="6" fill="url(#ember-hi)"/>
  <!-- bounce light at bottom rim -->
  <path d="M16 47 Q32 55 48 47" stroke="#ff6020" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- pooled shadow beneath -->
  <ellipse cx="32" cy="57" rx="13" ry="3" fill="#000000" opacity="0.22"/>
</svg>
