<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orb of Elevation. A magic item touched by this becomes rare; pale gold,
       almost white, like the instant a thing is recognised as more than it was. -->
  <defs>
    <radialGradient id="elev-body" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fdf6d0"/>
      <stop offset="0.55" stop-color="#d4aa40"/>
      <stop offset="1" stop-color="#7a5c10"/>
    </radialGradient>
    <radialGradient id="elev-hi" cx="0.33" cy="0.28" r="0.38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- flat-top hexagon: faceted cut gem silhouette -->
  <polygon points="53,33 42.5,51.2 21.5,51.2 11,33 21.5,14.8 42.5,14.8"
           fill="url(#elev-body)" stroke="#5a3e08" stroke-width="1.2"/>
  <!-- facet dividers suggesting cut surfaces -->
  <g stroke="#b89020" stroke-width="0.8" opacity="0.6">
    <line x1="32" y1="14.8" x2="32" y2="51.2"/>
    <line x1="21.5" y1="14.8" x2="42.5" y2="51.2"/>
    <line x1="42.5" y1="14.8" x2="21.5" y2="51.2"/>
  </g>
  <!-- specular highlight upper-left -->
  <ellipse cx="24" cy="25" rx="9" ry="6" fill="url(#elev-hi)"/>
  <!-- pooled shadow beneath -->
  <ellipse cx="32" cy="57" rx="14" ry="3" fill="#000000" opacity="0.22"/>
</svg>
