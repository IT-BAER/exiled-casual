<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable: the manifest names the game, the icons and the window it
         wants, and sw.js is what the browser requires before it will offer it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Exiled Casual — Combat Lab</title>
    <link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ebgaramond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The two faces the whole game is set in, self-hosted.
         Both were NAMED in the CSS from the start and neither was ever shipped,
         so every screen actually rendered in Georgia — a document font, which is
         what made the UI read like a web page. Local files rather than a Google
         Fonts link: an offline-first client must not have a third party between
         it and its own typeface, and the two latin subsets are 68kB together.
         SIL Open Font License 1.1, see /fonts/OFL.txt. */
      @font-face {
        font-family: "Cinzel";
        src: url(/fonts/cinzel-latin.woff2) format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: "EB Garamond";
        src: url(/fonts/ebgaramond-latin.woff2) format("woff2");
        font-weight: 400 700;
        font-display: swap;
        /* A Garamond has a small x-height, so it reads a size down from every
           other face at the same font-size. This puts the height back in the
           FONT rather than in a hundred call sites, and leaves the display face
           (Cinzel, set at the same numbers) exactly where it was. */
        size-adjust: 112%;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* A game, not a document: the HUD's labels and numbers must not turn the
         pointer into an I-beam or let a drag paint "Life 100/100" blue.
         There is no text input anywhere in the client to break. */
      body { user-select: none; -webkit-user-select: none; }
      /* One cursor, ours, everywhere. PoE never shows a Windows pointer: the arrow
         is a piece of the art, gilt and carved like the panel frames, so an OS
         hand or I-beam appearing over a button breaks the frame instantly. The
         !important is what retires the panels' inline pointer / grab / crosshair.
         Hotspot 1 1: the blade's tip sits one pixel in from the corner.

         32 CSS px, and not a pixel more, however much better 40 looked. Chromium
         drops any custom cursor larger than 32 DIP the moment its bitmap touches
         native UI, falling back to the Windows arrow. With the hotspot at the top
         left the bitmap hangs down and to the right of the pointer, so at 40 it
         crossed the bottom edge of the viewport about 50px early and the blade
         vanished over the flask row. Only the bottom and right edges showed it —
         towards the top the bitmap extends into the page and touches nothing. */
      * { cursor: url(/textures/ui/cursor_32.png) 1 1, default !important; }
      * { cursor: image-set(url(/textures/ui/cursor_32.png) 1x, url(/textures/ui/cursor_64.png) 2x) 1 1, default !important; }
      /* Illegal target for whatever is armed on the cursor: the same blade, cooled
         to red iron, so the refusal is legible without leaving the art. */
      [data-cursor="deny"] { cursor: url(/textures/ui/cursor_deny_32.png) 1 1, not-allowed !important; }
      [data-cursor="deny"] { cursor: image-set(url(/textures/ui/cursor_deny_32.png) 1x, url(/textures/ui/cursor_deny_64.png) 2x) 1 1, not-allowed !important; }
      #root { width: 100%; height: 100%; }

      /* The first-boot cover.

         Nothing React renders can cover the download of the bundle that contains
         React, so this one is markup and inline CSS: it is painted from the HTML
         itself, before a line of the client has parsed. Its plate is a separate
         small file (boot.jpg, ~90kB) that the preload scanner starts on the same
         breath as this document.

         It is torn out by main.tsx once React has something on screen, so the
         handover into LoadingScreen is one continuous plate rather than a flash
         of nothing between two of them. Deliberately has no tip and no area
         name: neither is known before the roster has been read. */
      #boot {
        position: fixed; inset: 0; z-index: 200;
        background: #07080a url(/textures/loading/boot.jpg) center / cover no-repeat;
        display: flex; align-items: flex-end; justify-content: center;
        transition: opacity 220ms linear;
      }
      #boot[hidden] { display: none; }
      #boot.gone { opacity: 0; pointer-events: none; }
      /* The same rendered ring the React plate draws, in the same place, so the
         handover does not move it. A CSS animation keeps turning while the main
         thread parses megabytes of JavaScript; a frame callback would not.

         The percentages are not arbitrary: `background-position: p%` aligns the
         p% point of the image with the p% point of the box, so across 8 cells
         the last one sits at 100% and there are only 7 gaps. `steps(8)` over
         0 -> 114.2857% is what lands each step on a cell. Same reasoning gives
         120% for the 6 rows. See the note in LoadingScreen.tsx. */
      #boot-ring {
        width: clamp(34px, 3.2vw, 58px); height: clamp(34px, 3.2vw, 58px);
        margin-bottom: calc(clamp(76px, 12vh, 136px) / 2 - clamp(17px, 1.6vw, 29px));
        background: url(/textures/loading/spinner.png) 0% 0% / 800% 600% no-repeat;
        animation: exiled-spin-x 1.05s steps(8) infinite,
                   exiled-spin-y 6.3s steps(6) infinite;
      }
      @keyframes exiled-spin-x { from { background-position-x: 0%; } to { background-position-x: 114.2857%; } }
      @keyframes exiled-spin-y { from { background-position-y: 0%; } to { background-position-y: 120%; } }
    </style>
  </head>
  <body>
    <div id="boot"><div id="boot-ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
