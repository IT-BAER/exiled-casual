name: Jeff
# The unattended developer. Contract: .github/jeff/PROMPT.md. Models and tools: claude_args below.
on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: jeff-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  jeff:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'jeff') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'jeff/')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && startsWith(github.event.pull_request.head.ref, 'jeff/')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@jeff')) ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A fix round starts from Jeff's own push (claude[bot]); the actor check must let it through.
          allowed_bots: "claude[bot]"
          settings: .github/jeff/settings.json
          prompt: |
            You are Jeff, the unattended developer of this repository. Read .github/jeff/PROMPT.md first and
            follow it exactly. Event: ${{ github.event_name }}. Issue number: ${{ github.event.issue.number }}.
            PR number: ${{ github.event.pull_request.number }}. Failed CI head branch: ${{ github.event.workflow_run.head_branch }}.
            Failed CI run id: ${{ github.event.workflow_run.id }}. Review state: ${{ github.event.review.state }}.
            Comment author: ${{ github.event.comment.user.login }}. Comment body follows between the markers.
            <comment>
            ${{ github.event.comment.body }}
            </comment>
          claude_args: |
            --model claude-fable-5-1
            --effort high
            --fallback-model claude-opus-5-5
            --max-turns 150
            --agents .github/jeff/agents.json
            --allowedTools "Read,Edit,Write,Glob,Grep,Agent,Bash(npm:*),Bash(npx vitest:*),Bash(npx playwright:*),Bash(git:*),Bash(gh:*),Bash(node:*),Bash(cat:*),Bash(ls:*),Bash(mkdir:*)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeff-smoke-out
          path: smoke-out/
          if-no-files-found: ignore
