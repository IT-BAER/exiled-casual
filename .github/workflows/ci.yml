name: CI
# Only a pushed release tag (tools/release.mjs, then git push --follow-tags) runs
# CI; everyday pushes to main are checked locally. release.yml runs its own tests.
on:
  push:
    tags: ["v*"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
      - run: npm run size
      - run: node tools/check_dev_surface.mjs
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every node: CI runs only on a release tag, so the full sweep is affordable.
      - run: npm run smoke -- --nodes all
        env:
          SMOKE_SETTLE_MS: "60000"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-out
          path: smoke-out/
