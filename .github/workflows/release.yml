name: Release
# A pushed tag v<version> becomes a GitHub release: notes are that version's
# CHANGELOG.md section, the asset is the built game (apps/web/dist) as a tarball.
# The tag must equal the version in package.json; tools/release.mjs makes both.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Tag matches package.json and CHANGELOG
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "tag v$version but package.json says $pkg" >&2; exit 1
          fi
          node tools/release_notes.mjs "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT";; esac
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
      - name: Pack the game
        run: tar -czf "exiled-casual-${{ steps.meta.outputs.version }}.tar.gz" -C apps/web/dist .
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file notes.md
          ${{ steps.meta.outputs.prerelease }}
          "exiled-casual-${{ steps.meta.outputs.version }}.tar.gz"
